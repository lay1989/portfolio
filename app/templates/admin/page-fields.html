{% macro page_field(name,label,value='',kind='text',limit=240,multiline=false,hint='') -%}
{% if kind == 'visibility' %}
<label class="ui-field">{{ label }}<select class="ui-input" name="{{ name }}"><option value="index"{% if value == 'index' %} selected{% endif %}>Allow indexing</option><option value="noindex"{% if value == 'noindex' %} selected{% endif %}>Keep out of search results</option></select><span class="ui-muted text-sm">Applies after publishing. The page stays public; this does not protect private content. Local previews stay out of search regardless.</span></label>
{% elif kind == 'inline' %}
<div data-rich-text><p id="label-{{ name }}" class="mb-4">{{ label }}</p><div data-toolbar class="editor-toolbar ui-row" role="toolbar" aria-label="Format {{ label }}" hidden><button type="button" data-format="strong" aria-label="Bold">Bold</button><button type="button" data-format="em" aria-label="Emphasis">Emphasis</button></div><div class="editor-canvas content-rich" data-rich-canvas contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="label-{{ name }}" hidden>{{ value|home_inline }}</div><label data-html-source class="ui-field">Formatted text source<textarea class="ui-input" data-rich-source name="{{ name }}" rows="5" maxlength="{{ limit }}">{{ value }}</textarea></label></div>
{% else %}
<label class="ui-field"><span id="label-{{ name }}">{{ label }}</span>{% if multiline %}<textarea class="ui-input" aria-labelledby="label-{{ name }}"{% if hint %} aria-describedby="hint-{{ name }}"{% endif %} name="{{ name }}" rows="4" maxlength="{{ limit }}">{{ value }}</textarea>{% else %}<input class="ui-input" aria-labelledby="label-{{ name }}"{% if hint %} aria-describedby="hint-{{ name }}"{% endif %} type="{{ kind if kind in ('email','url','number') else 'text' }}" name="{{ name }}" value="{{ value }}" {% if kind == 'number' %}min="1" max="180"{% else %}maxlength="{{ limit }}"{% endif %}>{% endif %}{% if hint %}<span id="hint-{{ name }}" class="ui-muted text-sm">{{ hint }}</span>{% endif %}</label>
{% endif %}
{%- endmacro %}
