{% if pagination.pages > 1 %}<nav class="ui-row justify-between mt-12" aria-label="Collection pages">{% if pagination.has_prev %}<a class="ui-button" data-variant="secondary" rel="prev" href="{{ page_url(pagination.prev_num) }}">Previous page</a>{% endif %}<span aria-current="page">Page {{ pagination.page }} of {{ pagination.pages }}</span>{% if pagination.has_next %}<a class="ui-button" data-variant="secondary" rel="next" href="{{ page_url(pagination.next_num) }}">Next page</a>{% endif %}</nav>{% endif %}
