# Ubuntu nginx template, included inside http{}. Replace .invalid host/cert paths.
# No static alias for media: Flask must recheck publication visibility on every use.
limit_req_zone $binary_remote_addr zone=portfolio_contact:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=portfolio_login:1m rate=10r/m;
log_format portfolio '$time_iso8601 $request_method $status $request_time $body_bytes_sent';

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name portfolio.example.invalid;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    server_name portfolio.example.invalid;
    ssl_certificate /etc/letsencrypt/live/portfolio.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_req_status 429;
    gzip off;
    access_log /var/log/nginx/portfolio-access.log portfolio;
    error_log /var/log/nginx/portfolio-error.log warn;

    location = /contact {
        limit_req zone=portfolio_contact burst=5 nodelay;
        include /etc/nginx/snippets/portfolio-proxy.conf;
    }
    location = /admin/login {
        limit_req zone=portfolio_login burst=10 nodelay;
        include /etc/nginx/snippets/portfolio-proxy.conf;
    }
    location = /readyz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include /etc/nginx/snippets/portfolio-proxy.conf;
    }
    # Compress code/SVG only. Token-bearing HTML and private responses stay uncompressed.
    location ~ ^/(public/.+\.(css|js|svg)|bundle\.js|tailwind\.css|src/theme-init\.js)$ {
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types text/css application/javascript image/svg+xml;
        include /etc/nginx/snippets/portfolio-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/portfolio-proxy.conf;
    }
}
